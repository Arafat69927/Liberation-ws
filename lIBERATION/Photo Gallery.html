</head>
<body>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="http://127.0.0.1:5500/main.html">Home</a></li>

    <section class="container">
  <h2 class="text-center mb-5">Liberation War Photo Gallery</h2>

  <!-- Category Buttons -->
  <div class="text-center mb-5">
    <button class="btn btn-outline-dark filter-btn" data-filter="all">All</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="events">Events</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="locations">Locations</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="people">People</button>
  </div>

  <!-- Gallery Grid -->
  <div class="row g-4" id="gallery">
    
    <!-- Image Item -->
    <div class="col-md-4 gallery-item events">
      <img src="photos/libaration 1.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/event1.jpg" alt="Liberation War Event">
    </div>

    <div class="col-md-4 gallery-item locations">
      <img src="photos/libaration 2.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/location1.jpg" alt="War Location">
    </div>

    <div class="col-md-4 gallery-item people">
      <img src="photos/libaration 3.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/people1.jpg" alt="Freedom Fighter">
    </div>
    <div class="col-md-4 gallery-item people">
      <img src="photos/libaration 3.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/people1.jpg" alt="Freedom Fighter">
    </div>
    <div class="col-md-4 gallery-item people">
      <img src="photos/libaration 3.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/people1.jpg" alt="Freedom Fighter">
    </div>
    <div class="col-md-4 gallery-item people">
      <img src="photos/libaration 3.jpg" class="img-fluid rounded gallery-img" 
           data-bs-toggle="modal" data-bs-target="#imageModal" 
           data-img="images/people1.jpg" alt="Freedom Fighter">
    </div>

  </div>
</section>

<div class="modal fade" id="imageModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-dark">
      <div class="modal-body text-center">
        <img id="modalImage" src="" class="img-fluid rounded mb-3">
        <div>
          <a id="downloadBtn" class="btn btn-success" download>
            <i class="bi bi-download"></i> Download
          </a>
          <button class="btn btn-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i> Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Image Modal 
  document.querySelectorAll('.gallery-img').forEach(img => {
    img.addEventListener('click', function () {
      const src = this.getAttribute('data-img');
      document.getElementById('modalImage').src = src;
      document.getElementById('downloadBtn').href = src;
    });
  });

  // Category Filter
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', function () {
      const filter = this.getAttribute('data-filter');
      document.querySelectorAll('.gallery-item').forEach(item => {
        item.style.display = (filter === 'all' || item.classList.contains(filter)) 
          ? 'block' : 'none';
      });
    });
  });
</script>

</body>

</html>
