<div class="container my-4 bg-dark text-info rounded p-3">
  <div class="row">

    <!-- Contact Form -->
    <div class="col-md-7">
      <h3 class="mb-4">Contact the Archive</h3>
      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Subject</label>
          <input type="text" class="form-control" placeholder="Subject">
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload File (Optional)</label>
          <input type="file" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
    </div>

    <!-- Contact Information -->
    <div class="col-md-5">
      <h3 class="mb-4">Contact Information</h3>
      <p><strong>Email:</strong> archive@example.com</p>
      <p><strong>Phone:</strong> +880 1234 567890</p>
      <p><strong>Address:</strong><br>
        Liberation War Archive<br>
        Dhaka, Bangladesh
      </p>
    </div>

  </div>
</div>
